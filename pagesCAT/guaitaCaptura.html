:root{
  --bg:#0E1116;--bg-deep:#0B0D10;--bg-deep2:#12161B;--bg-panel:#171B21;--bg-surface:#1E232B;--bg-hover:#252B34;
  --border:#2A313B;--border-soft:#222831;--border-hov:#3A424E;--border-strong:#4A5361;
  --text:#E7EAEE;--text-mid:#B9C0CA;--text-mut:#8B939F;--text-dim2:#5C6470;--text-faint:#454C57;
  --accent:#D6FB41;--accent-hover:#E2FF6E;--on-accent:#1A2000;--accent-soft:rgba(214,251,65,.08);--accent-soft2:rgba(214,251,65,.18);
  --green:#6EE7A8;--cyan:#4DD0E1;--danger:#FF5E5E;--warn:#FFB546;--err-bg:#3A1A1E;
  --q1:#C6FF00;--q2:#FF2ECC;--q3:#00E5FF;--q4:#FFE500;
  --sans:'IBM Plex Sans',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:400 13px/1.4 var(--sans)}
body{display:grid;grid-template-rows:auto auto 1fr auto;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:1px solid transparent;cursor:pointer}
input,select,textarea{background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:5px;padding:5px 7px;font:inherit;width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible,.mi:focus-visible{outline:1px solid var(--accent);outline-offset:1px}
input[type=checkbox]{width:auto;accent-color:var(--accent)}
textarea{resize:vertical;min-height:60px}
.btn{background:var(--bg-surface);border:1px solid var(--border);border-radius:5px;padding:5px 10px;white-space:nowrap}
.btn:hover{border-color:var(--border-hov);background:var(--bg-hover)}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:600}
.btn.pri:hover{background:var(--accent-hover)}
.btn.danger{color:var(--danger)}
.btn[disabled]{opacity:.4;pointer-events:none}
.top{display:flex;align-items:center;gap:12px;padding:4px 10px;background:var(--bg-panel);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;white-space:nowrap}
.brand .ver{font:500 11px var(--mono);color:var(--text-mut)}
.pre{font:600 9.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--warn);border:1px solid var(--warn);border-radius:4px;padding:1px 5px}
.menubar{display:flex;gap:2px}
.menu{position:relative}
.menu-btn{font:500 13px var(--sans);color:var(--text-mid);padding:6px 9px;border-radius:5px}
.menu-btn:hover,.menu.open>.menu-btn{background:var(--bg-hover);color:var(--text)}
.menu-list{display:none;position:absolute;top:100%;left:0;z-index:60;background:var(--bg-surface);border:1px solid var(--border);border-radius:7px;box-shadow:0 12px 34px rgba(0,0,0,.45);padding:5px;min-width:280px}
.menu.open>.menu-list{display:block}
.mhead{padding:7px 14px 3px;font:600 9.5px var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--text-dim2)}
.mi{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:5px;color:var(--text);position:relative;cursor:pointer;white-space:nowrap}
.mi:hover{background:var(--accent-soft2)}
.mi .chk{width:14px;color:var(--accent);flex:none}
.mi .k{margin-left:auto;padding-left:18px;font:500 11px var(--mono);color:var(--text-mut)}
.mi[aria-disabled=true]{opacity:.38;pointer-events:none}
.mi.has-sub::after{content:'▸';margin-left:auto;padding-left:18px;color:var(--text-mut)}
.mi>.menu-list{top:-6px;left:calc(100% - 4px)}
.mi.has-sub:hover>.menu-list{display:block}
.msep{height:1px;background:var(--border);margin:5px 4px}
.quick{margin-left:auto;display:flex;gap:6px}
.prebar{display:flex;align-items:center;gap:10px;padding:5px 12px;background:#2A2110;border-bottom:1px solid #4A3A18;color:#FFD9A0;font-size:12px}
.prebar b{color:var(--warn)}
.prebar .sp{margin-left:auto;display:flex;gap:6px}
.prebar .btn{padding:2px 8px;font-size:12px}
main{display:grid;grid-template-columns:220px 1fr 330px;min-height:0}
main.nodetail{grid-template-columns:220px 1fr}
main.nodetail .detail{display:none}
.side,.detail{background:var(--bg-panel);overflow:auto;min-height:0}
.side{border-right:1px solid var(--border);padding:10px}
.detail{border-left:1px solid var(--border)}
.shead{margin:14px 2px 6px;font:600 9.5px var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--text-dim2);display:flex;align-items:center}
.shead button{margin-left:auto;color:var(--text-mut);padding:0 4px;font:600 14px var(--mono)}
.shead button:hover{color:var(--accent)}
.nav{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:5px;cursor:pointer;color:var(--text-mid)}
.nav:hover{background:var(--bg-hover)}
.nav.on{background:var(--accent-soft2);color:var(--text)}
.nav .n{margin-left:auto;font:500 11px var(--mono);color:var(--text-mut)}
.nav .x{display:none;color:var(--text-mut);padding:0 3px}
.nav:hover .x{display:inline}
.nav:hover .n{display:none}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font:500 11px var(--mono);padding:2px 7px;border:1px solid var(--border);border-radius:10px;cursor:pointer;color:var(--text-mid)}
.tag.on{border-color:var(--accent);color:var(--accent)}
.gridwrap{overflow:auto;min-height:0;padding:12px;position:relative}
.gridwrap.drop{outline:2px dashed var(--accent);outline-offset:-8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--tw,180px),1fr));gap:10px}
.card{background:var(--bg-surface);border:1px solid var(--border);border-radius:7px;overflow:hidden;user-select:none;position:relative}

.grid.list{grid-template-columns:1fr;gap:4px}

.welcome{max-width:560px;margin:60px auto;text-align:center;color:var(--text-mid)}

.dot{width:8px;height:8px;border-radius:50%;background:var(--text-dim2);display:inline-block}

.row{display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap}

.fld{margin-top:9px}

.prev{border:1px solid var(--border);border-radius:6px;overflow:hidden;cursor:zoom-in;max-height:220px;display:flex;justify-content:center;

dialog{background:var(--bg-panel);color:var(--text);border:1px solid var(--border);border-radius:9px;padding:0;max-width:680px;width:calc(100% - 32px);box-shadow:0 20px 60px rgba(0,0,0,.6)}

.tool{padding:5px 9px;border-radius:5px;border:1px solid var(--border);background:var(--bg-surface)}

.sw{width:20px;height:20px;border-radius:4px;border:2px solid transparent;cursor:pointer}

.stage{position:relative;overflow:auto;display:flex;align-items:center;justify-content:center;padding:16px}

.edtext{position:absolute;z-index:3;background:rgba(0,0,0,.6);border:1px solid var(--accent);color:#fff;width:260px}
.ov{grid-template-rows:auto 1fr auto}

.edmain{display:grid;grid-template-columns:auto 1fr;min-height:0}

.stage{min-height:0;align-items:flex-start;justify-content:flex-start}

.ovbar input[type=color]{width:30px;height:26px;padding:1px}

.ovbar select{width:auto;padding:3px 5px}
.grp{display:flex;align-items:center;gap:6px;padding-left:8px;border-left:1px solid var(--border)}
#crLp{position:absolute;right:16px;top:104px;border:1px solid var(--accent);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.6);pointer-events:none;image-rendering:pixelated;display:none}
#crLp.l{right:auto;left:16px}
.edadj{position:absolute;right:16px;top:96px;width:280px;background:var(--bg-panel);border:1px solid var(--border);border-radius:8px;padding:12px;box-shadow:0 12px 34px rgba(0,0,0,.6);z-index:5}
.edadj label{display:grid;grid-template-columns:86px 1fr 34px;align-items:center;gap:6px;font-size:12px;margin:6px 0}
.edadj label.ck{display:flex}
.edadj input[type=range]{padding:0}
.sess{display:flex;align-items:center;gap:6px;font:500 11px var(--mono);color:var(--green);border:1px solid var(--border);border-radius:5px;padding:2px 4px 2px 8px;max-width:280px}
.sess span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sess button{color:var(--text-mut);padding:0 4px}
.menu-list.ctx{position:fixed;z-index:300}
.menu-list.ctx.subl .mi>.menu-list{left:auto;right:calc(100% - 4px)}
#printArea{display:none}
@media (max-width:980px){main{grid-template-columns:1fr}.side,.detail{display:none}.quick .lbl{display:none}}
@media print{
  html,body{background:#fff;height:auto;overflow:visible;display:block}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block}
  .ppage{position:relative;overflow:hidden;page-break-after:always;break-after:page;background:#fff;color:#111;font-family:var(--sans)}
  .ppage:last-child{page-break-after:auto;break-after:auto}
  .ppage *{position:absolute}
  .ppage img{object-fit:contain}
}

function clipWrite(rec,scale){ // s'ha de cridar directament des del gest de l'usuari (ClipboardItem amb promesa)
  if(!rec){toast('Selecciona primer un element','warn');return Promise.resolve();}
  scale=scale||$('#clipScale').value||'1';
  const after=clipReadback;
  if(rec.kind==='text'){const p=BRIDGE&&BRIDGE.writeClipboard?BRIDGE.writeClipboard({text:rec.text}):navigator.clipboard.writeText(rec.text);
    return Promise.resolve(p).then(()=>{toast('Text al porta-retalls: '+rec.name);after();});}
  const make=(async()=>{let b=rec.blob;if(scale!=='1'||b.type!=='image/png'){const bmp=await toBitmap(b);const d=scaleDims(bmpW(bmp),bmpH(bmp),scale);b=await bitmapToBlob(bmp,'image/png',d.w,d.h);}return b;})();
  let p;if(BRIDGE&&BRIDGE.writeClipboard)p=make.then(b=>BRIDGE.writeClipboard({image:b}));
  else{if(!navigator.clipboard||typeof ClipboardItem==='undefined'||!navigator.clipboard.write)return Promise.reject(new Error('Aquest navegador no permet escriure imatges al porta-retalls'));
    p=navigator.clipboard.write([new ClipboardItem({'image/png':make})]);}
  return p.then(()=>{toast(`Al porta-retalls: ${rec.name}${scale!=='1'?' ('+$('#clipScale').selectedOptions[0].text+')':''} — enganxa-la amb Ctrl+V a l'altre programa`);after();});}
function renderClip(){const c=S.clip,box=$('#clipBox');box.innerHTML='';
  if(c.kind==='image'){const u=URL.createObjectURL(c.blob);if(c.url)URL.revokeObjectURL(c.url);c.url=u;box.append(el('img',{src:u,alt:'Imatge del porta-retalls'}));}
  else if(c.kind==='text')box.append(el('pre',{},c.text.slice(0,2000)));
  else box.append(el('div',{class:'empty'},c.state==='denied'?'Permís de lectura denegat. Prem «Llegeix» i accepta-ho, o revisa els permisos del lloc.':c.state==='error'?c.err:c.at?'El porta-retalls és buit o conté un format no suportat.':'Prem «Llegeix» per veure què hi ha al porta-retalls.'));
  $('#clipDot').className='dot '+(c.state==='ok'?'ok':c.state);
  $('#clipInfo').textContent=c.at?`${c.kind==='image'?'Imatge':c.kind==='text'?'Text':'Buit'}${c.types.length?' · '+c.types.join(', '):''} · llegit ${timeAgo(c.at)}`:'';
  $('#clipAuto').checked=!!S.settings.autoClip;
  if(!BRIDGE&&location.protocol==='file:')$('#clipInfo').textContent='⚠ Obert com a fitxer local (file://): el navegador no recorda el permís del porta-retalls i l\'historial automàtic queda desactivat. Serveix l\'app per https o localhost, o instal·la-la com a PWA. «Llegeix» i Ctrl+V funcionen igualment.';}

const ED={rec:null,base:null,base0:null,ops:[],hist:[],hi:-1,tool:'select',selId:null,sel:null,drag:null,draft:null,step:1,dirty:false,filter:'',zoom:'fit',

const edSelObj=()=>ED.ops.find(o=>o.id===ED.selId)||null;
const edMk=(t,extra)=>({id:uid(),t,stroke:ED.P.stroke,fill:ED.P.fill,lw:ED.P.lw,op:ED.P.op,dash:ED.P.dash,fs:ED.P.fs,rot:0,...extra});
const opBox=o=>isPts(o)?ptsBox(o.pts):{x:o.x,y:o.y,w:o.w,h:o.h};

const edK=()=>{const cv=$('#edCv');return cv.width/(cv.getBoundingClientRect().width||cv.width);};
function edPt(e){const cv=$('#edCv'),b=cv.getBoundingClientRect();return{x:(e.clientX-b.left)*cv.width/b.width,y:(e.clientY-b.top)*cv.height/b.height};}

/* historial: cada estat desa la imatge base (per referència, mai es modifica) i els objectes */
function edSnap(){ED.hist=ED.hist.slice(0,ED.hi+1);ED.hist.push({base:ED.base,ops:JSON.stringify(ED.ops),step:ED.step});
  while(ED.hist.length>40||new Set(ED.hist.map(h=>h.base)).size>8)ED.hist.shift();ED.hi=ED.hist.length-1;}
function edCommit(){edSnap();ED.dirty=true;edRender();edSyncUI();}
function edRestore(i){const h=ED.hist[i];if(!h)return;ED.hi=i;const ch=ED.base!==h.base;ED.base=h.base;ED.ops=JSON.parse(h.ops);ED.step=h.step;ED.selId=null;ED.sel=null;ED.draft=null;ED.dirty=true;if(ch)edFit();edRender();edSyncUI();}
const edUndo=()=>{if(ED.hi>0)edRestore(ED.hi-1);};
const edRedo=()=>{if(ED.hi<ED.hist.length-1)edRestore(ED.hi+1);};
function edNewBase(fn,w,h){const c=mkCanvas(w||ED.base.width,h||ED.base.height),x=c.getContext('2d');fn(x,c);ED.base=c;return c;}
const edCopyBase=fn=>edNewBase(x=>{x.drawImage(ED.base,0,0);if(fn)fn(x);});
function edFit(){const cv=$('#edCv');cv.width=ED.base.width;cv.height=ED.base.height;edZoom();}
function edZoom(){const cv=$('#edCv'),z=ED.zoom;if(z==='fit'){cv.style.width='';cv.style.maxWidth='100%';cv.style.maxHeight='100%';}else{cv.style.width=Math.round(cv.width*parseFloat(z))+'px';cv.style.maxWidth='none';cv.style.maxHeight='none';}}

/* dibuix dels objectes */
function cloudPath(x,w,h,r){const edge=(ax,ay,bx,by,nx,ny)=>{const len=Math.hypot(bx-ax,by-ay),n=Math.max(1,Math.round(len/(2*r))),st=len/n;for(let i=0;i<n;i++){const sx=ax+(bx-ax)*i/n,sy=ay+(by-ay)*i/n,ex=ax+(bx-ax)*(i+1)/n,ey=ay+(by-ay)*(i+1)/n;x.quadraticCurveTo((sx+ex)/2+nx*st*.9,(sy+ey)/2+ny*st*.9,ex,ey);}};
  x.moveTo(0,0);edge(0,0,w,0,0,-1);edge(w,0,w,h,1,0);edge(w,h,0,h,0,1);edge(0,h,0,0,-1,0);x.closePath();}
function calloutPath(x,o){const w=o.w,h=o.h,r=Math.min(w,h)*.18,tx=o.tx,ty=o.ty,bw=Math.min(w,h)*.14,dx=(tx-w/2)/w,dy=(ty-h/2)/h;
  const side=Math.abs(dx)>Math.abs(dy)?(dx>0?'r':'l'):(dy>0?'b':'t'),out=!(tx>=0&&tx<=w&&ty>=0&&ty<=h);
  const cx=Math.max(r+bw,Math.min(w-r-bw,tx)),cy=Math.max(r+bw,Math.min(h-r-bw,ty));
  x.moveTo(r,0);if(out&&side==='t'){x.lineTo(cx-bw,0);x.lineTo(tx,ty);x.lineTo(cx+bw,0);}
  x.arcTo(w,0,w,h,r);if(out&&side==='r'){x.lineTo(w,cy-bw);x.lineTo(tx,ty);x.lineTo(w,cy+bw);}
  x.arcTo(w,h,0,h,r);if(out&&side==='b'){x.lineTo(cx+bw,h);x.lineTo(tx,ty);x.lineTo(cx-bw,h);}
  x.arcTo(0,h,0,0,r);if(out&&side==='l'){x.lineTo(0,cy+bw);x.lineTo(tx,ty);x.lineTo(0,cy-bw);}
  x.arcTo(0,0,w,0,r);x.closePath();}
function opPath(x,o){const w=o.w,h=o.h;
  if(o.t==='round')rrPath(x,0,0,w,h,Math.min(w,h)*.18);
  else if(o.t==='ellipse')x.ellipse(w/2,h/2,w/2,h/2,0,0,Math.PI*2);
  else if(o.t==='triangle'){x.moveTo(w/2,0);x.lineTo(w,h);x.lineTo(0,h);x.closePath();}
  else if(o.t==='rhombus'){x.moveTo(w/2,0);x.lineTo(w,h/2);x.lineTo(w/2,h);x.lineTo(0,h/2);x.closePath();}
  else if(o.t==='star'){for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,r=i%2?.42:1,px=w/2+Math.cos(a)*r*w/2,py=h/2+Math.sin(a)*r*h/2;i?x.lineTo(px,py):x.moveTo(px,py);}x.closePath();}
  else if(o.t==='cloud')cloudPath(x,w,h,Math.max(8,o.lw*3.5));
  else if(o.t==='callout')calloutPath(x,o);
  else x.rect(0,0,w,h);}
function arrowHead(x,from,to,lw){const a=Math.atan2(to[1]-from[1],to[0]-from[0]),hl=Math.max(12,lw*4);x.beginPath();x.moveTo(to[0],to[1]);x.lineTo(to[0]-hl*Math.cos(a-.42),to[1]-hl*Math.sin(a-.42));x.lineTo(to[0]-hl*Math.cos(a+.42),to[1]-hl*Math.sin(a+.42));x.closePath();x.fill();}
function edMeasure(o){const x=$('#edCv').getContext('2d');x.save();x.font=`600 ${o.fs}px 'IBM Plex Sans',sans-serif`;const ls=String(o.str).split('\n');o.w=Math.max(8,...ls.map(l=>x.measureText(l).width));o.h=ls.length*o.fs*1.2;x.restore();}
function drawOp(x,o,base){x.save();const al=o.op==null?1:o.op;x.globalAlpha=al;x.lineJoin='round';x.lineCap='round';x.lineWidth=o.lw;x.strokeStyle=x.fillStyle=o.stroke;if(o.dash)x.setLineDash([Math.max(2,o.lw)*3,Math.max(2,o.lw)*2.2]);
  if(isPts(o)){const P=o.pts,n=P.length;if(n<2){x.restore();return;}const lw=Math.max(1,o.lw);x.lineWidth=lw;
    if(o.t==='marker'){x.globalAlpha=al*.4;x.lineWidth=lw*4;x.lineCap='butt';}
    const hl=Math.max(12,lw*4)*.6,cut=(a,b)=>{const L=Math.hypot(b[0]-a[0],b[1]-a[1])||1;return[b[0]-(b[0]-a[0])/L*hl,b[1]-(b[1]-a[1])/L*hl];};
    let A=P[0],B=P[n-1];if(o.t==='arrow'||o.t==='arrow2')B=cut(P[n-2],P[n-1]);if(o.t==='arrow2')A=cut(P[1],P[0]);
    x.beginPath();x.moveTo(A[0],A[1]);for(let i=1;i<n-1;i++)x.lineTo(P[i][0],P[i][1]);x.lineTo(B[0],B[1]);
    if(o.t==='polygon'){x.closePath();if(o.fill){x.fillStyle=o.fill;x.fill();x.fillStyle=o.stroke;}}
    x.stroke();x.setLineDash([]);
    if(o.t==='arrow'||o.t==='arrow2')arrowHead(x,P[n-2],P[n-1],lw);if(o.t==='arrow2')arrowHead(x,P[1],P[0],lw);
    x.restore();return;}
  const w=Math.max(1,o.w),h=Math.max(1,o.h);
  if(o.t==='blur'||o.t==='pixel'){x.globalAlpha=1;x.setLineDash([]);const X=Math.round(o.x),Y=Math.round(o.y),ww=Math.round(w),hh=Math.round(h);
    if(o.t==='blur'&&'filter' in x){const r=Math.max(4,Math.round(Math.min(base.width,base.height)/110)),pad=r*3,sx=Math.max(0,X-pad),sy=Math.max(0,Y-pad),ex=Math.min(base.width,X+ww+pad),ey=Math.min(base.height,Y+hh+pad);
      if(ex>sx&&ey>sy){x.beginPath();x.rect(X,Y,ww,hh);x.clip();x.filter=`blur(${r}px)`;x.drawImage(base,sx,sy,ex-sx,ey-sy,sx,sy,ex-sx,ey-sy);x.filter='none';}}
    else{const s=Math.max(6,Math.round(Math.min(base.width,base.height)/90)),t=mkCanvas(Math.ceil(ww/s),Math.ceil(hh/s));t.getContext('2d').drawImage(base,X,Y,ww,hh,0,0,t.width,t.height);x.imageSmoothingEnabled=false;x.drawImage(t,0,0,t.width,t.height,X,Y,ww,hh);}
    x.restore();return;}
  x.translate(o.x+w/2,o.y+h/2);x.rotate(o.rot||0);x.translate(-w/2,-h/2);
  if(o.t==='hl'){x.globalAlpha=al*.35;x.fillRect(0,0,w,h);}
  else if(o.t==='text'){const fs=o.fs,ls=String(o.str).split('\n');x.setLineDash([]);x.font=`600 ${fs}px 'IBM Plex Sans',sans-serif`;x.textBaseline='top';
    if(o.fill){const p=fs*.25;x.fillStyle=o.fill;x.fillRect(-p,-p,w+2*p,h+2*p);}else{x.lineWidth=Math.max(2,fs/7);x.strokeStyle=contrast(o.stroke)==='#ffffff'?'#ffffff':'#000000';ls.forEach((l,i)=>x.strokeText(l,0,i*fs*1.2+fs*.1));}
    x.fillStyle=o.stroke;ls.forEach((l,i)=>x.fillText(l,0,i*fs*1.2+fs*.1));}
  else if(o.t==='step'){const r=Math.min(w,h)/2;x.setLineDash([]);x.beginPath();x.arc(w/2,h/2,r,0,Math.PI*2);x.fill();x.lineWidth=Math.max(1.5,r*.08);x.strokeStyle='#000000';x.stroke();x.fillStyle=contrast(o.stroke);x.font=`600 ${Math.round(r*1.1)}px 'IBM Plex Mono',monospace`;x.textAlign='center';x.textBaseline='middle';x.fillText(String(o.n),w/2,h/2+r*.06);}
  else if(o.t==='stamp'){x.setLineDash([]);x.globalAlpha=al*.88;const bw=Math.max(2,h*.07);x.lineWidth=bw;x.beginPath();rrPath(x,bw/2,bw/2,w-bw,h-bw,h*.16);x.stroke();x.lineWidth=Math.max(1,bw*.35);x.beginPath();rrPath(x,bw*1.9,bw*1.9,w-bw*3.8,h-bw*3.8,h*.1);x.stroke();
    const s=String(o.str||'').toUpperCase();let fs=h*.46;x.font=`700 ${fs}px 'IBM Plex Sans',sans-serif`;const tw=x.measureText(s).width;if(tw>w*.8){fs*=w*.8/tw;x.font=`700 ${fs}px 'IBM Plex Sans',sans-serif`;}x.textAlign='center';x.textBaseline='middle';x.fillText(s,w/2,h/2+fs*.04);}
  else{x.beginPath();opPath(x,o);if(o.fill){x.fillStyle=o.fill;x.fill();}if(o.lw>0)x.stroke();
    if(o.t==='callout'&&o.str){x.setLineDash([]);const fs=o.fs,ls=String(o.str).split('\n');x.fillStyle=o.stroke;x.font=`600 ${fs}px 'IBM Plex Sans',sans-serif`;x.textAlign='center';x.textBaseline='middle';const y0=h/2-(ls.length-1)*fs*.6;ls.forEach((l,i)=>x.fillText(l,w/2,y0+i*fs*1.2));}}
  x.restore();}
function renderFlat(){const c=mkCanvas(ED.base.width,ED.base.height),x=c.getContext('2d');x.drawImage(ED.base,0,0);for(const o of ED.ops)drawOp(x,o,ED.base);return c;}
function edHandles(o,kk){const H=[];
  if(isPts(o)&&o.pts.length===2){o.pts.forEach((q,i)=>H.push({k:'p'+i,x:q[0],y:q[1]}));return H;}
  const B=isPts(o)?{...ptsBox(o.pts),rot:0}:o,corners=o.t==='text'||o.t==='step';
  for(const[a,b]of[[0,0],[.5,0],[1,0],[1,.5],[1,1],[.5,1],[0,1],[0,.5]]){if(corners&&(a===.5||b===.5))continue;const w=toWorld(B,{x:B.w*a,y:B.h*b});H.push({k:'b',a,b,x:w.x,y:w.y});}
  if(!['blur','pixel'].includes(o.t)){const w=toWorld(B,{x:B.w/2,y:-26*kk});H.push({k:'rot',x:w.x,y:w.y});}
  if(o.t==='callout'){const w=toWorld(o,{x:o.tx,y:o.ty});H.push({k:'tail',x:w.x,y:w.y});}
  return H;}
function hitOp(o,p,tol){if(isPts(o)){const t=tol+Math.max(1,o.lw)/2*(o.t==='marker'?4:1),P=o.pts;for(let i=0;i<P.length-1;i++)if(segDist(p,P[i],P[i+1])<=t)return true;
    if(o.t==='polygon'){if(segDist(p,P[P.length-1],P[0])<=t)return true;if(o.fill&&inPoly(p,P))return true;}return false;}
  const l=toLocal(o,p);return l.x>=-tol&&l.x<=o.w+tol&&l.y>=-tol&&l.y<=o.h+tol;}
function edPick(p,tol){for(let i=ED.ops.length-1;i>=0;i--)if(hitOp(ED.ops[i],p,tol))return ED.ops[i];return null;}
function edRender(){const cv=$('#edCv'),x=cv.getContext('2d'),W=cv.width,H=cv.height,kk=edK();x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,W,H);x.drawImage(ED.base,0,0);
  if(ED.filter&&'filter' in x){x.save();if(ED.sel){x.beginPath();shapePath(x,ED.sel);x.clip();}x.clearRect(0,0,W,H);x.filter=ED.filter;x.drawImage(ED.base,0,0);x.restore();}
  for(const o of ED.ops)drawOp(x,o,ED.base);
  const d=ED.drag;if(d&&d.o&&(d.m==='box'||d.m==='line'||d.m==='free'))drawOp(x,d.o,ED.base);
  const line=(f)=>{x.save();x.lineWidth=1.5*kk;x.setLineDash([]);x.strokeStyle='#000000';x.beginPath();f();x.stroke();x.setLineDash([5*kk,5*kk]);x.strokeStyle='#ffffff';x.beginPath();f();x.stroke();x.restore();};
  if(ED.sel)line(()=>shapePath(x,ED.sel));
  if(d&&d.m==='selbox'&&d.r)line(()=>shapePath(x,{shape:d.shape,...d.r}));
  if(d&&d.m==='sellasso')line(()=>d.pts.forEach((q,i)=>i?x.lineTo(q[0],q[1]):x.moveTo(q[0],q[1])));
  if(ED.draft){const D=ED.draft;x.save();x.lineWidth=1.5*kk;x.strokeStyle='#D6FB41';x.fillStyle='#D6FB41';x.beginPath();D.pts.forEach((q,i)=>i?x.lineTo(q[0],q[1]):x.moveTo(q[0],q[1]));if(D.cur)x.lineTo(D.cur.x,D.cur.y);x.stroke();for(const q of D.pts)x.fillRect(q[0]-3*kk,q[1]-3*kk,6*kk,6*kk);x.restore();}
  const o=ED.tool==='select'?edSelObj():null;
  if(o){x.save();x.lineWidth=kk;x.strokeStyle='#D6FB41';x.setLineDash([4*kk,3*kk]);const B=isPts(o)?{...ptsBox(o.pts),rot:0}:o;
    if(!(isPts(o)&&o.pts.length===2)){x.beginPath();[[0,0],[1,0],[1,1],[0,1]].forEach(([a,b],i)=>{const w=toWorld(B,{x:B.w*a,y:B.h*b});i?x.lineTo(w.x,w.y):x.moveTo(w.x,w.y);});x.closePath();x.stroke();}
    x.setLineDash([]);x.fillStyle='#D6FB41';x.strokeStyle='#0B0D10';
    for(const h of edHandles(o,kk)){x.beginPath();if(h.k==='rot'||h.k==='tail')x.arc(h.x,h.y,5*kk,0,Math.PI*2);else x.rect(h.x-4*kk,h.y-4*kk,8*kk,8*kk);x.fill();x.stroke();}x.restore();}}

/* interacció */
function edTool(t){if(ED.draft){ED.draft=null;}ED.tool=t;if(t!=='select')ED.selId=null;edRender();edSyncUI();}

/* ───────── exportar / importar ───────── */
function download(blob,name){const u=URL.createObjectURL(blob);const a=el('a',{href:u,download:name});document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);}

  if(want==='orig'||extOf(s.type)===(want==='jpeg'?'jpg':want))return{blob:s.blob,ext:extOf(s.type)};
  const t=want==='jpeg'?'image/jpeg':want==='webp'?'image/webp':'image/png';const b=await bitmapToBlob(await toBitmap(s.blob),t,0,0,0.92,t==='image/jpeg'?'#fff':null);return{blob:b,ext:extOf(b.type)};}
async function exportSelected(){const list=selRecs();if(!list.length)return toast('No hi ha res seleccionat','warn');
  if(list.length===1){const{blob,ext}=await exportBlob(list[0]);return download(blob,`${list[0].name}.${ext}`);}
  const used=new Set(),entries=[];for(const s of list){const{blob,ext}=await exportBlob(s);entries.push({name:uniqueFile(s.name,ext,used),data:new Uint8Array(await blob.arrayBuffer()),date:new Date(s.created)});}
  download(new Blob([zipBuild(entries)],{type:'application/zip'}),`guaitaCaptura_seleccio_${ymd(new Date())}.zip`);toast(`${list.length} elements exportats en un .zip`);}
async function exportArchive(){if(!S.shots.length)return toast('L\'arxiu és buit','warn');const used=new Set(),usedO=new Set(),entries=[],items=[];
  for(const s of S.shots){const m={...s};delete m.blob;delete m.thumb;delete m.orig;if(s.kind==='image'&&s.ops&&s.orig){m.origFile='originals/'+uniqueFile(s.name,'png',usedO);entries.push({name:m.origFile,data:new Uint8Array(await s.orig.arrayBuffer()),date:new Date(s.created)});}if(s.kind==='image'){m.file='imatges/'+uniqueFile(s.name,extOf(s.type),used);entries.push({name:m.file,data:new Uint8Array(await s.blob.arrayBuffer()),date:new Date(s.created)});}items.push(m);}
  entries.unshift({name:'guaitaCaptura.json',data:new TextEncoder().encode(JSON.stringify({app:'guaitaCaptura',format:2,version:VERSION,exported:new Date().toISOString(),collections:S.collections,items},null,1))});
  download(new Blob([zipBuild(entries)],{type:'application/zip'}),`guaitaCaptura_arxiu_${ymd(new Date())}.zip`);await DB.setMeta('lastExport',Date.now());toast(`Arxiu exportat: ${S.shots.length} elements`);renderStatus();}
async function importZip(file){const files=await zipRead(new Uint8Array(await file.arrayBuffer()));const idx=files.find(f=>f.name==='guaitaCaptura.json');let added=0,skipped=0;
  if(idx){const j=JSON.parse(new TextDecoder().decode(idx.data));if(j.app!=='guaitaCaptura')throw new Error('El .zip no és un arxiu de guaitaCaptura');
    for(const c of j.collections||[])if(!S.collections.includes(c))S.collections.push(c);await saveCols();
    for(const it of j.items||[]){if(S.shots.some(s=>s.hash===it.hash)){skipped++;continue;}const base={name:it.name,collection:it.collection||'',tags:it.tags||[],notes:it.notes||'',star:it.star,created:it.created,source:it.source,batch:true};
      if(it.kind==='text'){await addText(it.text||'',base);added++;}
      else{const f=files.find(x=>x.name===it.file);if(!f){skipped++;continue;}const nr=await addImage(new Blob([f.data],{type:it.type||typeOfExt(it.file)}),base);const fo=it.ops&&it.origFile&&files.find(x=>x.name===it.origFile);if(fo){nr.ops=it.ops;nr.orig=new Blob([fo.data],{type:'image/png'});await DB.put(nr);}added++;}}}
  else{for(const f of files){const t=typeOfExt(f.name);if(!t)continue;await addImage(new Blob([f.data],{type:t}),{source:'importat',name:f.name.replace(/^.*\//,'').replace(/\.[^.]+$/,''),batch:true});added++;}}
  render();toast(`Importats ${added} elements${skipped?` · ${skipped} omesos (duplicats o sense fitxer)`:''}`);}
async function importFiles(list){let n=0;for(const f of list){if(/\.zip$/i.test(f.name)||f.type==='application/zip'||f.type==='application/x-zip-compressed'){await importZip(f);continue;}
    if(f.type.startsWith('image/')){await addImage(f,{source:'importat',name:f.name.replace(/\.[^.]+$/,''),batch:true});n++;}
    else if(f.type==='text/plain'){await addText(await f.text(),{source:'importat',name:f.name.replace(/\.[^.]+$/,''),batch:true});n++;}}

async function textCanvas(text,wpx,hpx){const c=document.createElement('canvas');c.width=wpx;c.height=hpx;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,wpx,hpx);x.fillStyle='#111';

async function doPrint(list,o){const src=await printSources(list);const L=computeLayout(src.length,o);const mm=v=>(v*25.4/72).toFixed(2)+'mm';const area=$('#printArea');area.innerHTML='';
  $('#pageStyle').textContent=`@page{size:A4 ${o.landscape?'landscape':'portrait'};margin:0}`;const loads=[];const total=L.pages.length,today=ymd(new Date());
  L.pages.forEach((pg,pi)=>{const p=el('div',{class:'ppage',style:`width:${mm(pg.w)};height:${mm(pg.h)}`});
    if(o.header)p.append(el('div',{style:`left:${mm(L.m)};top:${mm(L.m)};font-size:12pt;font-weight:600`},o.header));
    for(const c of pg.cells){const it=src[c.i],f=fitBox(it.w,it.h,c.img,o.caption!=='none'),u=URL.createObjectURL(it.blob);const im=el('img',{src:u,style:`left:${mm(f.x)};top:${mm(f.y)};width:${mm(f.w)};height:${mm(f.h)};outline:0.2mm solid #bbb`});
      loads.push(new Promise(r=>{im.onload=im.onerror=r;}));p.append(im);
      if(o.caption!=='none')capLines(it.s,o).forEach((t,k)=>p.append(el('div',{style:`left:${mm(c.cap.x)};top:${mm(c.cap.y+2+k*10)};width:${mm(c.cap.w)};font-size:${k?7:8}pt;color:${k?'#555':'#111'};white-space:nowrap;overflow:hidden;text-overflow:ellipsis`},t)));}
    p.append(el('div',{style:`left:${mm(L.m)};top:${mm(pg.h-L.m)};font-size:7pt;color:#777;font-family:var(--mono)`},`guaitaCaptura ${VERSION} · ${today} · ${pi+1}/${total}`));area.append(p);});
  await Promise.all(loads);await sleep(50);const clean=()=>{$$('#printArea img').forEach(i=>URL.revokeObjectURL(i.src));area.innerHTML='';window.removeEventListener('afterprint',clean);};
  window.addEventListener('afterprint',clean);window.print();}
async function doPdf(list,o){toast('Generant PDF…');const src=await printSources(list);const L=computeLayout(src.length,o);const images=[],pages=[];const today=ymd(new Date());
  for(const pg of L.pages){const ops=[];if(o.header)ops.push({t:'txt',x:L.m,y:L.m+11,s:11,str:o.header});
    for(const c of pg.cells){const it=src[c.i],f=fitBox(it.w,it.h,c.img,o.caption!=='none');const bmp=await toBitmap(it.blob);const k=Math.min(1,(f.w*200/72)/it.w);const W=Math.max(1,Math.round(it.w*k)),H=Math.max(1,Math.round(it.h*k));
      const jb=await bitmapToBlob(bmp,'image/jpeg',W,H,0.9,'#fff');images.push({bytes:new Uint8Array(await jb.arrayBuffer()),w:W,h:H});
      ops.push({t:'img',i:images.length-1,...f},{t:'rect',...f});

function toast(msg,kind='',ms=3600){const t=el('div',{class:'toast '+kind},msg);$('#toasts').append(t);setTimeout(()=>t.remove(),ms);}
function err(e){console.error(e);toast((e&&e.message)||String(e),'err',6000);}

function dialog(title,body,buttons){const d=$('#dlg');$('#dlgH').textContent=title;const b=$('#dlgB');b.innerHTML='';b.append(body);const f=$('#dlgF');f.innerHTML='';
  return new Promise(res=>{let val=null;

    d.onclose=()=>res(val);d.showModal();const fi=b.querySelector('input,select,textarea');if(fi)setTimeout(()=>{fi.focus();if(fi.select)fi.select();},20);});}
function ask({title,msg,input,placeholder,ok='D\'acord',danger}){const body=el('div',{});if(msg)body.append(el('p',{style:'margin:0 0 8px'},msg));let inp=null;
  if(input!==undefined){inp=el('input',{value:input,placeholder:placeholder||''});inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('#dlgF .pri,#dlgF .danger:last-child')?.click();}});body.append(inp);}
  let v=null;return dialog(title,body,[{l:'Cancel·la'},{l:ok,pri:!danger,danger,v:'__ok'}]).then(r=>{if(r!=='__ok')return input!==undefined?null:false;return inp?inp.value.trim():true;});}
function showLimits(){dialog('Limitacions de la versió 0.2.0 (preliminar, no RC)',el('div',{html:LIMITS_HTML}),[{l:'Entesos',pri:true,f:()=>DB.setMeta('seenLimits',VERSION)}]);}
const LIMITS_HTML=`
<p><b style="color:var(--warn)">Aquesta és una versió preliminar 0.2.0 i no és una Release Candidate.</b> Serveix per provar el flux de treball abans de la versió d'escriptori (Electron). Pot tenir errors, i el format intern de l'arxiu pot canviar entre versions: <b>exporta l'arxiu (.zip) sovint</b>.</p>
<h4>Captura de pantalla</h4><ul>
<li>El navegador sempre mostra el seu diàleg per triar pantalla, finestra o pestanya (getDisplayMedia). L'app només hi pot proposar un tipus; per no repetir el diàleg, inicia una sessió de captura.</li>
<li>En capturar la pantalla sencera, l'app espera que canviïs de finestra: si no, sortiria ella mateixa a la captura.</li>
<li>No hi ha drecera global del sistema: Alt+S, Alt+R i Alt+T només funcionen amb guaitaCaptura en primer pla, també durant una sessió de captura.</li>
<li>No funciona en mòbils ni tauletes (no tenen getDisplayMedia). Allà només es pot enganxar o importar.</li>
<li>La captura és un fotograma del vídeo compartit: pot sortir l'avís «S'està compartint» del navegador i, segons el sistema, el cursor.</li>
<li>El retall es fa sobre la imatge ja capturada, no directament a la pantalla.</li></ul>
<h4>Porta-retalls</h4><ul>
<li>No es pot vigilar en segon pla. L'historial automàtic només llegeix quan tornes a l'app: si copies diverses coses en altres programes, només es desa l'última.</li>
<li>Llegir requereix permís (Chrome/Edge el demanen el primer cop). Firefox i Safari tenen un suport limitat o demanen confirmació a cada lectura.</li>
<li>Només imatge i text pla. No es conserven formats rics (HTML, RTF, fitxers copiats de l'explorador).</li>
<li>En posar una imatge al porta-retalls sempre es converteix a PNG (és l'únic format d'escriptura fiable). JPG i WebP es reconverteixen.</li>
<li>Cal un context segur: https o localhost. Obrint l'HTML amb file:// la lectura i l'escriptura del porta-retalls poden fallar.</li>
<li>Enganxar amb Ctrl+V dins l'app funciona sempre, sense permisos.</li>
<li>L'historial automàtic només llegeix si el permís ja està concedit, i no ho fa durant una captura. Obert amb file:// queda desactivat.</li></ul>
<h4>Editor</h4><ul>
<li>Els ajustos de color necessiten un navegador amb filtres de canvas (Chrome, Edge, Firefox i Safari recents).</li>
<li>Girar, emmirallar, redimensionar i el retall no rectangular fusionen les anotacions amb la imatge.</li>
<li>La vareta màgica, la goma i la substitució de color actuen sobre la imatge base, no sobre les anotacions.</li>
<li>Difuminar i pixelar no protegeixen res si comparteixes la captura original sense difuminar.</li></ul>
<h4>Arxiu i emmagatzematge</h4><ul>
<li>Les captures es desen a IndexedDB del navegador, lligades a aquest navegador i a aquesta adreça. Esborrar les dades de navegació les esborra.</li>
<li>L'espai és limitat (quota del navegador). Activa «emmagatzematge persistent» a Configuració perquè el navegador no l'esborri sota pressió.</li>
<li>No hi ha sincronització entre dispositius ni desament directe a una carpeta del disc.</li></ul>
<h4>Impressió i PDF</h4><ul>
<li>La impressió passa pel diàleg del navegador. Els marges i l'escala poden variar segons el navegador.</li>
<li>El PDF desa les imatges en JPEG: les zones transparents hi surten blanques. Els textos del PDF només admeten caràcters llatins (Latin-1): altres alfabets surten com a «?».</li></ul>
<h4>Encara no disponible</h4><ul>
<li>Enviar a guaitaPDF Edit, guaita.MDeditor o altres apps Guaita.</li>
<li>OCR de les captures.</li></ul>
<h4>Què resoldrà la versió Electron</h4><ul>
<li>Vigilància contínua del porta-retalls i historial complet.</li>
<li>Dreceres globals i icona a la safata del sistema.</li>
<li>Captura sense diàleg i desament a carpetes del disc.</li></ul>
<p class="small">Aquesta app ja està preparada per a Electron: si existeix <span class="mono">window.guaitaBridge</span> (preload), l'utilitza per capturar i llegir/escriure el porta-retalls.</p>`;

    if(isTyping(e.target))return;
    if(mod&&k==='c'&&one()){e.preventDefault();clipWrite(one()).catch(err);return;}
    if(mod&&k==='a'){e.preventDefault();selectAll();return;}
    if(mod&&k==='d'){e.preventDefault();run(dupSelected);return;}
    if(e.key==='Delete'||e.key==='Backspace'&&e.metaKey){e.preventDefault();run(delSelected);return;}
    if(e.key==='F1'){e.preventDefault();window.open(HELP_URL,'_blank','noopener');return;}
    if(e.key==='F2'){e.preventDefault();focusName();return;}
    if(!mod&&!e.altKey&&k==='r'&&oneImg()){e.preventDefault();run(()=>recrop(oneImg()));return;}
    if(!mod&&!e.altKey&&k==='e'&&oneImg()){e.preventDefault();run(()=>openEditor(oneImg()));return;}
    if(!mod&&!e.altKey&&k==='s'&&hasSel()){e.preventDefault();run(starSelected);return;}
    if(['arrowright','arrowleft','arrowdown','arrowup'].includes(k)){const ids=visible().map(s=>s.id);if(!ids.length)return;e.preventDefault();const cur=ids.indexOf(S.anchor);const cols=S.settings.view==='list'?1:Math.max(1,getComputedStyle($('#grid')).gridTemplateColumns.split(' ').length);
      const step={arrowright:1,arrowleft:-1,arrowdown:cols,arrowup:-cols}[k];select([ids[Math.max(0,Math.min(ids.length-1,cur<0?0:cur+step))]]);}});
  window.addEventListener('focus',()=>setTimeout(autoClipRead,250));
  edInit();}

/* ───────── arrencada ───────── */
async function init(){bind();buildMenus();
  try{await DB.open();}catch(e){DB.useMemory();toast('IndexedDB no disponible: les captures només es guarden mentre l\'app estigui oberta','err',9000);}
  try{const st=await DB.getMeta('settings');if(st)S.settings={...S.settings,...st};S.collections=(await DB.getMeta('collections'))||[];S.shots=(await DB.all()).sort((a,b)=>b.created-a.created);
    if(navigator.storage&&navigator.storage.persisted)S.persisted=await navigator.storage.persisted();}catch(e){err(e);}
  applyLayout();render();renderClip();
  try{if(navigator.permissions&&S.settings.autoClip){const p=await navigator.permissions.query({name:'clipboard-read'});if(p.state==='granted')clipRead(false,{baseline:true});}}catch(e){}
  if(BRIDGE&&BRIDGE.onClipboardChange)BRIDGE.onClipboardChange(()=>{if(S.settings.autoClip)clipRead(false);});
  if((await DB.getMeta('seenLimits'))!==VERSION)showLimits();
  if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});}
window.GC={VERSION,makeName,sanitizeName,crc32,zipBuild,zipRead,buildPdf,pdfStr,computeLayout,fitBox,clipText,scaleDims,fnv1a,uniqueFile,extOf,typeOfExt,parseTags,S,visible,ptsBox,inPoly,segDist,toLocal,toWorld,hexRgb,rgbHex,contrast,floodAlpha,replaceColor,filterStr,fitRatio,ED,hitOp,edHandles};
if(!window.__GC_NO_INIT)document.addEventListener('DOMContentLoaded',()=>init().catch(err));
</script>
